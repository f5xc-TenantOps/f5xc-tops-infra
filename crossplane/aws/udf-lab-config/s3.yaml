---
apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  name: tops-registry-bucket-v2
  labels:
    app.kubernetes.io/name: tops-core-v2
    app.kubernetes.io/component: s3-lab-registry
spec:
  forProvider:
    region: us-east-1
    tags:
      Name: tops-registry-bucket-v2
      Environment: production
      ManagedBy: crossplane
      Application: tops-core
  providerConfigRef:
    name: default
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketPublicAccessBlock
metadata:
  name: tops-registry-bucket-v2-public-access
  labels:
    app.kubernetes.io/name: tops-core-v2
    app.kubernetes.io/component: s3-lab-registry
spec:
  forProvider:
    region: us-east-1
    bucketRef:
      name: tops-registry-bucket-v2
    blockPublicAcls: true
    blockPublicPolicy: false
    ignorePublicAcls: true
    restrictPublicBuckets: false
  providerConfigRef:
    name: default
---
# PrincipalOrgPaths is substituted at sync time by the envsubst CMP plugin
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketPolicy
metadata:
  name: tops-registry-bucket-v2-policy
  labels:
    app.kubernetes.io/name: tops-core-v2
    app.kubernetes.io/component: s3-lab-registry
spec:
  forProvider:
    region: us-east-1
    bucketRef:
      name: tops-registry-bucket-v2
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "AllowCrossAccountRead",
            "Effect": "Allow",
            "Principal": "*",
            "Condition": {
              "ForAnyValue:StringLike": {
                "aws:PrincipalOrgPaths": "${UDF_ORG_PATH}"
              }
            },
            "Action": [
              "s3:ListBucket",
              "s3:GetBucketLocation"
            ],
            "Resource": "arn:aws:s3:::tops-registry-bucket-v2"
          },
          {
            "Sid": "ReadFiles",
            "Effect": "Allow",
            "Principal": "*",
            "Condition": {
              "ForAnyValue:StringLike": {
                "aws:PrincipalOrgPaths": "${UDF_ORG_PATH}"
              }
            },
            "Action": [
              "s3:GetObject"
            ],
            "Resource": "arn:aws:s3:::tops-registry-bucket-v2/*"
          }
        ]
      }
  providerConfigRef:
    name: default
---
apiVersion: s3.aws.upbound.io/v1beta1
kind: BucketObject
metadata:
  name: tops-registry-bucket-v2-config-json
  labels:
    app.kubernetes.io/name: tops-core-v2
    app.kubernetes.io/component: s3-lab-registry
spec:
  forProvider:
    region: us-east-1
    bucketRef:
      name: tops-registry-bucket-v2
    key: config.json
    contentType: application/json
    content: |
      {
        "sqsURL": "https://sqs.us-east-1.amazonaws.com/430171053948/tops-udf-queue-v2",
        "stateBucket": "tops-deployment-state-v2"
      }
  providerConfigRef:
    name: default
